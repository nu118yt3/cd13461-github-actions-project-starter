name: Automating a Simple CI/CD Pipeline

on:
    push:
        branches:
            - main
        paths-ignore:
            - .gitignore
            - README.md
            - CONTRIBUTING.md
            - LICENSE
    pull_request:
        branches:
            - main
        paths-ignore:
            - .gitignore
            - README.md
            - CONTRIBUTING.md
            - LICENSE
    workflow_dispatch:
        inputs:
          force_deploy:
            description: "Force deployment in an emergency"
            required: true
            default: false
            type: boolean

concurrency:
    group: deploy-knowledge-base
    cancel-in-progress: true

permissions:
        contents: read
jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Checkout the repository
              uses: actions/checkout@v4
              with:
                persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: 18.12
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run linters
              run: npm run lint --if-present

            - name: Run Scripts
              env:
                URL_CHECKER_TIMEOUT: ${{ vars.URL_CHECKER_TIMEOUT }}
              shell: bash
              run: |
                set -euo pipefail : "${URL_CHECKER_TIMEOUT:=30}"

                if [ ! -d script ]; then
                  echo "script directory was not found"
                  exit 1
                fi
                while IFS= read -r -d '' script_file; do
                 echo "Running ${script_file}"
                 if [ "$(basename "${script_file}")" = "url-checker.js" ]; then
                    node "${script_file}" --timeout "${URL_CHECKER_TIMEOUT}"
                 else
                    node "${script_file}"
                 fi
                done < <(find script -type f -name "*.js" -print0 | sort -z)

        
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: test
        timeout-minutes: 2
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                persist-credentials: false

            - name: Setup Github Pages
              uses: actions/configure-pages@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build static pages
              env:
                PATH_PREFIX: /${{github.event.repository.name}}/
              run: npm run eleventy:prod

            - name: Upload built site
              uses: actions/upload-pages-artifact@v3
              with:
                path: _site

    deploy:
        name: Deploy
        runs-on: ubuntu-latest
        needs:
          - test
          - build
        timeout-minutes: 2
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_deploy)
        environment:
            name: github-pages
            url: ${{steps.deployment.outputs.page_url}}
        permissions:
            contents: read
            pages: write
            id-token: write
            issues: write
        steps:
            - name: Download built site
              uses: actions/download-artifact@v4
              with:
                name: github-pages
                path: _site-artifact
            - name: Deploy to Github Pages
              id: deployment
              uses: actions/deploy-pages@v4
              continue-on-error: true
            - name: Create deployment status issue
              if: always()
              env:
                GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
                DEPLOYMENT_OUTCOME: ${{steps.deployment.outcome}}
                DEPLOYMENT_URL: ${{steps.deployment.outputs.page_url}}
              shell: bash
              run: |
                set -euo pipefail

                if [ "${DEPLOYMENT_OUTCOME}" = "success" ]; then
                  status="succeeded"
                  url="${DEPLOYMENT_URL}"
                else
                  status="failed"
                  url="Deployment failed before a GitHub Pages URL was available."
                fi
    
                today="$(date +%F)"
                gh issue create \
                --title "${today} - Deployment: ${status}" \
                --body "URL: ${url}"

            - name: Fail job if deployment failed
              if: steps.deployment.outcome != 'success'
              run: exit 1